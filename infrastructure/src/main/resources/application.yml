# =====================================================================
# Configuración común a todos los perfiles
# Los valores sensibles NUNCA van aquí: llegan por variables de entorno
# o por el archivo .env local (que no se sube a GitHub).
# =====================================================================
spring:
  application:
    name: renta-herramientas

  config:
    # Carga el .env si existe. Se buscan dos rutas porque al ejecutar con
    # "mvn -pl infrastructure spring-boot:run" el directorio de trabajo es el módulo.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # Evita consultas a la BD desde la vista/controlador; las transacciones terminan en el caso de uso
    open-in-view: false
    hibernate:
      # Flyway crea y modifica el esquema; Hibernate solo verifica que las entidades coincidan
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
        # Carga relaciones en lotes de 50 (evita el problema N+1 al listar)
        "[default_batch_fetch_size]": 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    # Si alguien modifica una migración ya aplicada, la app no arranca (protege la integridad del esquema)
    validate-on-migrate: true

  servlet:
    multipart:
      # Límite para la carga de imágenes de herramientas
      max-file-size: 5MB
      max-request-size: 10MB

# Servidor Apache Tomcat embebido
server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
  tomcat:
    connection-timeout: 20s
    threads:
      max: 200
      min-spare: 10

# Almacenamiento local de imágenes de herramientas
media:
  storage:
    base-path: ${MEDIA_BASE_PATH:./uploads}

# Configuración propia de la aplicación
app:
  jwt:
    # Clave HMAC en Base64 de al menos 256 bits (32 bytes). Sin valor por defecto: si falta, la app no arranca
    secret: ${JWT_SECRET}
    expiracion: ${JWT_EXPIRACION:60m}
    emisor: renta-herramientas-api
  cors:
    # Orígenes del frontend autorizados a llamar la API, separados por coma
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
  reservas:
    # Tiempo que tiene el cliente para pagar una reserva aprobada; después pasa a VENCIDA
    plazo-pago: ${RESERVAS_PLAZO_PAGO:24h}
    dias-maximos-alquiler: 90
    # Cada cuánto se buscan reservas aprobadas sin pago para vencerlas
    revision-inicial: PT20S
    revision-cada: PT5M

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
