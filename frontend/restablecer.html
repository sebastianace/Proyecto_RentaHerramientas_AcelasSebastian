<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva contraseña · ObraYa</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F25C05'/%3E%3Cpath d='M7 12h13a3 3 0 0 1 3 3v1H7z M23 14h4 M11 16l-1 8h4l1-8' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<main class="auth-main" style="min-height:calc(100vh - 68px)">
  <div class="auth-card">
    <form class="stack" data-form novalidate>
      <div><span class="eyebrow">Recuperación de cuenta</span>
        <h2 style="margin-top:.5rem">Crea tu nueva contraseña</h2>
        <p class="muted">Mínimo 8 caracteres, con al menos una letra y un número.</p></div>
      <label class="field"><span>Nueva contraseña</span><input class="input" type="password" name="password" autocomplete="new-password" minlength="8" required></label>
      <label class="field"><span>Repite la contraseña</span><input class="input" type="password" name="confirmacion" autocomplete="new-password" required></label>
      <div class="notice bad hidden" data-error></div>
      <button class="btn btn-primary btn-lg btn-block" type="submit">Guardar contraseña</button>
    </form>
  </div>
</main>
<script type="module" src="assets/js/paginas/restablecer.js"></script>
</body>
</html>
